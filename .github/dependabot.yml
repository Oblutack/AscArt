# Weekly pull requests for outdated dependencies. Dev tooling is grouped so it
# doesn't turn into a dozen separate PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Only minor and patch updates are grouped: one major that can't install
      # (below) used to hold the whole group back
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Electron majors move fast; look at those by hand
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      # eslint-plugin-jsx-a11y only supports ESLint up to 9, so ESLint 10
      # can't be installed next to it yet
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Keep the Node types on the Node that CI and Electron run
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    # numpy, Pillow and the PyInstaller stack are pinned together on purpose
    # (see engine.spec and the packaging notes in the README)
    ignore:
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
      # rembg brings this in, and OpenCV 5 can't be installed with NumPy 1.26
      - dependency-name: opencv-python-headless
        update-types: ["version-update:semver-major"]
      - dependency-name: onnxruntime
      - dependency-name: rembg
      - dependency-name: pyinstaller

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    groups:
      charm:
        patterns: ["charm.land/*", "github.com/charmbracelet/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
