name: CI

on:
  push:
  pull_request:

# A branch with an open PR triggers both events; only keep the latest run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - run: pip install -r python/requirements-dev.txt
      # The video tests need a real ffmpeg
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m ruff check
        working-directory: python
      - run: python -m pytest
        working-directory: python

  # The terminal app and command line (cli/), on the three systems it ships for
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      # The video tests need a real ffmpeg; elsewhere they skip themselves
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w"; exit 1; }
      - run: go vet ./...
      - name: Tests (with the race detector where there is a C compiler)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race ./...
          else
            go test ./...
          fi

  # The real app, end to end: Electron, the Python backend and the built UI
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - run: pip install -r python/requirements-dev.txt
      # The video tests need a real ffmpeg
      - run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    env:
      # The Electron binary isn't needed to run the tests or build the UI
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run react-build
