name: Release

# Push a tag like v1.2.0 to build installers for every platform and attach
# them to a GitHub release. "Run workflow" builds them without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            builder: --win
          - name: macos-arm64
            os: macos-latest
            builder: --mac --arm64
          - name: linux
            os: ubuntu-22.04
            builder: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - run: pip install -r python/requirements.txt
      - run: npm ci
      - run: npm run react-build

      # The Python backend, frozen into one executable
      - run: npm run build:engine

      - name: Check that the engine starts and answers
        shell: bash
        run: |
          ENGINE=python/dist/engine
          if [ -f "$ENGINE.exe" ]; then ENGINE="$ENGINE.exe"; fi
          echo '{"command":"ping"}' | "$ENGINE" | tee ping.out
          grep -q '"pong"' ping.out

      - name: Package the app
        shell: bash
        # If electron-builder fails, show the end of its output in the run's
        # annotations, where it is easy to find
        run: |
          # No certificate configured: build unsigned. The variables must be
          # unset, not empty: an empty CSC_LINK is read as a path to the project.
          if [ -z "${CSC_LINK}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          set +e
          npx electron-builder ${{ matrix.builder }} --publish never 2>&1 | tee builder.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 40 builder.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=electron-builder failed::$message"
          fi
          exit "$status"
        env:
          # Signing is optional: add these secrets and the build is signed,
          # leave them out and it is not.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: AscArt-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.7z
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage

  # The command line and terminal app are plain Go, so every system's binary
  # is built here by cross-compiling
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        working-directory: cli
        env:
          CGO_ENABLED: "0"
        run: |
          version="dev"
          case "$GITHUB_REF" in refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;; esac
          mkdir -p ../cli-dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="ascart_${version}_${os}_${arch}"
            binary="ascart"; [ "$os" = "windows" ] && binary="ascart.exe"
            mkdir -p "../cli-dist/$name"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../cli-dist/$name/$binary" ./cmd/ascart
            cp ../LICENSE "../cli-dist/$name/" 2>/dev/null || true
            if [ "$os" = "windows" ]; then
              (cd ../cli-dist && zip -qr "$name.zip" "$name")
            else
              tar -C ../cli-dist -czf "../cli-dist/$name.tar.gz" "$name"
            fi
            rm -r "../cli-dist/$name"
          done
          (cd ../cli-dist && sha256sum * > "ascart_${version}_checksums.txt")
          ls -la ../cli-dist
      - uses: actions/upload-artifact@v7
        with:
          name: ascart-cli
          if-no-files-found: error
          path: cli-dist/*

  release:
    needs: [build, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
