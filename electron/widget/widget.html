<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>AscArt Widget</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <div id="context-menu">
      <button class="context-menu-item" data-action="show-controls">
        Show Controls
      </button>
      <button class="context-menu-item danger" data-action="close">
        Remove Widget
      </button>
    </div>

    <div id="widget-container" class="controls-visible">
      <div id="ascii-display">
        <pre id="ascii-content"></pre>
      </div>

      <div id="widget-controls">
        <div class="widget-controls-row">
          <div class="widget-controls-left">
            <button class="widget-btn" data-action="toggle-controls">
              Hide Controls
            </button>
          </div>
          <button class="widget-btn widget-btn-close" data-action="close">
            Close Widget
          </button>
        </div>

        <div id="playback-controls" class="widget-controls-row hidden">
          <div class="widget-controls-left">
            <button
              id="btn-play"
              class="widget-btn widget-btn-small"
              data-action="toggle-play"
            >
              || Pause
            </button>
            <button class="widget-btn widget-btn-small" data-action="prev">
              ◀ Prev
            </button>
            <button class="widget-btn widget-btn-small" data-action="next">
              Next ▶
            </button>
          </div>
          <span class="frame-info" id="frame-info">Frame 1/1</span>
        </div>

        <div class="widget-controls-row">
          <div class="widget-controls-left">
            <span class="size-label">Size:</span>
            <button class="widget-btn widget-btn-small" data-action="smaller">
              − Smaller
            </button>
            <span class="frame-info size-info" id="size-info">6px</span>
            <button class="widget-btn widget-btn-small" data-action="larger">
              Larger +
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="widget.js"></script>
  </body>
</html>
